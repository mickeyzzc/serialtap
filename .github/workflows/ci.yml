name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test with coverage gate (80%)
        run: |
          COVERPKG=$(go list ./... | grep -v internal/testutil | tr "\n" ",")
          go test -race -count=1 -coverpkg="$COVERPKG" -covermode=atomic -coverprofile=cover.out ./...
          pct=$(go tool cover -func cover.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p < 80) ? 1 : 0 }'

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o serialtap .
      - uses: actions/upload-artifact@v4
        with:
          name: serialtap-${{ matrix.goos }}-${{ matrix.goarch }}
          path: serialtap
