name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin"
      - name: Lint
        run: "$(go env GOPATH)/bin/golangci-lint run"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test with coverage gate (80%)
        run: |
          go test -race -count=1 -covermode=atomic -coverprofile=cover.out ./...
          pct=$(go tool cover -func cover.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p < 80) ? 1 : 0 }'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o serialtap .
      - uses: actions/upload-artifact@v4
        with:
          name: serialtap-linux-amd64
          path: serialtap
