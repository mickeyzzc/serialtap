<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>serialtap · 观测面板</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect x="2" y="2" width="96" height="96" rx="22" fill="%230F172A"/><path d="M14 32 H28 V52 H42 V32 H56 V52 H70 V32 H86" fill="none" stroke="%23E2E8F0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M49 52 V76" fill="none" stroke="%232DD4BF" stroke-width="8" stroke-linecap="round"/><circle cx="49" cy="82" r="6.5" fill="%232DD4BF"/></svg>'>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--fg:#e6edf3;--dim:#8b949e;
--green:#3fb950;--amber:#d29922;--blue:#58a6ff;--red:#f85149;--teal:#39d2c0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border)}
header .logo{flex:none;display:block}
header h1{font-size:17px;margin:0}
#toast{margin-left:auto;font-size:12px;color:var(--teal);opacity:0;transition:opacity .3s}
#toast.show{opacity:1}
header .dim{color:var(--dim);font-size:12px}
main{padding:16px 20px;max-width:1500px;margin:0 auto}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;cursor:pointer}
.card.sel{border-color:var(--blue)}
.card .top{display:flex;align-items:center;gap:8px}
.card .name{font-weight:600;font-size:15px;cursor:pointer}
.card .tty{color:var(--dim);font-size:12px}
.chip{font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--border);color:var(--dim)}
.chip.collecting{color:var(--green);border-color:var(--green)}
.chip.paused{color:var(--amber);border-color:var(--amber)}
.chip.suspended{color:var(--blue);border-color:var(--blue)}
.chip.flashing{color:var(--red);border-color:var(--red)}
.badge{font-size:11px;color:var(--teal)}
.meta{color:var(--dim);font-size:12px;margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.meta b{color:var(--fg);font-weight:500}
.acts{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
button{background:#21262d;color:var(--fg);border:1px solid var(--border);border-radius:6px;
padding:3px 10px;font-size:12px;cursor:pointer}
button:hover{border-color:var(--blue)}
button.danger:hover{border-color:var(--red)}
.grid2{display:grid;grid-template-columns:1.7fr 1fr;gap:12px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.panel .hd{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.panel .hd .t{font-weight:600}
.tabs{display:flex;gap:4px}
.tab{padding:2px 10px;border-radius:6px;cursor:pointer;color:var(--dim);font-size:12px}
.tab.on{background:#21262d;color:var(--fg)}
#log{height:340px;overflow-y:auto;padding:8px 12px;margin:0;font:12px/1.45 Consolas,monospace;
white-space:pre-wrap;word-break:break-all;background:#0a0e14}
#events{height:340px;overflow-y:auto;padding:8px 12px;font:12px/1.5 Consolas,monospace}
.ev-dev{color:var(--teal);margin-top:6px}
.ev-line{white-space:pre-wrap;word-break:break-all}
.ev-line:has(.hit){color:var(--amber)}
label.ck{font-size:12px;color:var(--dim);display:flex;gap:4px;align-items:center;cursor:pointer}
select{background:#21262d;color:var(--fg);border:1px solid var(--border);border-radius:6px;font-size:12px;padding:2px 6px}
#files a{color:var(--blue);text-decoration:none}
#nodata{color:var(--dim);padding:20px;text-align:center}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(3,6,12,.72);display:flex;align-items:center;justify-content:center;z-index:50}
.mbox{background:var(--card);border:1px solid var(--border);border-radius:10px;width:min(680px,92vw);max-height:88vh;display:flex;flex-direction:column}
.mhd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)}
.mhd b{font-size:14px}
.mbody{padding:12px 14px;overflow:auto}
.mbody label{display:block;font-size:12px;color:var(--dim);margin:8px 0 2px}
.mbody input{background:#0a0e14;color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:12px;max-width:100%}
.mrow{display:flex;align-items:center;gap:10px;margin-top:12px}
#fmLog{height:220px;overflow-y:auto;margin:10px 0 0;padding:8px 10px;font:12px/1.45 Consolas,monospace;
white-space:pre-wrap;word-break:break-all;background:#0a0e14;border-radius:6px}
</style>
</head>
<body>
<header>
  <svg class="logo" width="26" height="26" viewBox="0 0 100 100" aria-hidden="true"><rect x="2" y="2" width="96" height="96" rx="22" fill="#0F172A"/><path d="M14 32 H28 V52 H42 V32 H56 V52 H70 V32 H86" fill="none" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M49 52 V76" fill="none" stroke="#2DD4BF" stroke-width="8" stroke-linecap="round"/><circle cx="49" cy="82" r="6.5" fill="#2DD4BF"/></svg>
  <h1>serialtap · 观测面板</h1>
  <span class="dim" id="root">—</span>
  <span class="dim" id="conn"></span>
  <span id="toast"></span>
</header>
<main>
  <div id="cards"><div id="nodata">暂无设备接入</div></div>
  <div class="grid2">
    <div class="panel">
      <div class="hd">
        <span class="t">实时日志</span>
        <select id="devSel" title="选择要查看的设备/串口"></select>
        <span class="tabs">
          <span class="tab on" data-kind="serial" id="tabSerial">全量</span>
          <span class="tab" data-kind="events" id="tabEvents">事件流</span>
        </span>
        <label class="ck"><input type="checkbox" id="autoscroll" checked>自动滚动</label>
        <button id="btnClear">清屏</button>
        <span class="dim" id="viewerDev" style="font-size:12px;color:var(--dim)"></span>
      </div>
      <pre id="log">选择左侧设备卡片查看…</pre>
    </div>
    <div class="panel">
      <div class="hd"><span class="t">最近事件</span><span class="dim" style="font-size:11px">签名命中 · 生命周期 · 刷机</span></div>
      <div id="events"></div>
    </div>
  </div>
</main>

<div id="flashModal" class="modal hidden">
  <div class="mbox">
    <div class="mhd"><b>代理刷机</b> <span class="dim" id="fmDev" style="font-size:12px"></span>
      <button id="fmClose" style="margin-left:auto">关闭</button></div>
    <div class="mbody">
      <label>设备正则（多板同名时请锚定，如 ^board$）</label>
      <input id="fmPattern" size="18" placeholder="^board$">
      <label>镜像文件（可多选；顺序 = 刷写顺序）</label>
      <input id="fmBins" type="file" multiple>
      <label>偏移 offsets（JSON 数组，与镜像顺序对齐；缺省全 0x0）</label>
      <input id="fmOffsets" size="38" placeholder='["0x0","0x8000","0x10000"]'>
      <label style="margin-top:12px">或直接给 ESP-IDF 构建产物（与镜像二选一）</label>
      <input id="fmArgs" type="file" accept=".json">
      <div class="mrow"><button id="fmGo">开始刷写</button><span class="dim" id="fmState" style="font-size:12px"></span></div>
      <pre id="fmLog">（刷写进度将实时显示在这里）</pre>
    </div>
  </div>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; };
const fmtKB = n => n >= 1048576 ? (n/1048576).toFixed(1)+" MB" : (n/1024).toFixed(1)+" KB";

let status = {devices:[]}, prevSize = {}, rate = {};
let selDev = null, selKind = "serial", es = null, logBuf = "";
let cardSig = ""; // 卡片结构签名：不变则只就地更新数字，绝不重建 DOM —— 每秒全量重建会把进行中的点击吞掉
const LOG_CAP = 256 * 1024;

function pollStatus(){
  fetch("/api/status").then(r=>r.json()).then(s=>{
    $("conn").textContent = "● 已连接";
    status = s; $("root").textContent = s.root;
    for (const d of s.devices){
      const r = prevSize[d.name] !== undefined && prevSize[d.name] <= d.serial_size
        ? d.serial_size - prevSize[d.name] : rate[d.name];
      rate[d.name] = r === undefined ? 0 : r;
      prevSize[d.name] = d.serial_size;
    }
    // 尚未选中或选中的设备已拔出 → 自动选首台，日志区不空屏
    if (s.devices.length && (!selDev || !s.devices.some(d=>d.name === selDev))) selectDev(s.devices[0].name);
    else renderCards();
  }).catch(()=>{ $("conn").textContent = "○ 守护进程不可达"; });
}
setInterval(pollStatus, 1000); pollStatus();

// devSig: 卡片结构签名（影响 DOM 结构/按钮文案的字段）。易变的速率/大小
// 不参与签名 —— 就地更新，不触发重建。
function devSig(){
  return JSON.stringify(status.devices.map(d=>[d.name,d.tty,d.key,d.state,d.proxy,d.proxy_endpoint]));
}

function renderCards(){
  const c = $("cards");
  if (!status.devices.length){
    if (c.innerHTML.indexOf("nodata") < 0) c.innerHTML = '<div id="nodata">暂无设备接入</div>';
    cardSig = ""; syncDevSel();
    return;
  }
  const sig = devSig();
  if (sig === cardSig){ updateVolatile(); return; }
  cardSig = sig;
  c.innerHTML = "";
  for (const d of status.devices){
    const el = document.createElement("div");
    el.className = "card" + (d.name === selDev ? " sel" : "");
    el.dataset.dev = d.name;
    el.innerHTML = `
      <div class="top">
        <span class="name">${esc(d.name)}</span>
        <span class="chip ${d.state}">${esc(d.state)}</span>
        ${d.proxy ? `<span class="badge">proxy ${esc(d.proxy)}</span>` : ""}
      </div>
      <div class="tty">${esc(d.tty)} · key=${esc(d.key)}</div>
      <div class="meta">
        <span>写入 <b class="v-rate"></b></span>
        <span>全量 <b class="v-ssz"></b></span>
        <span>事件 <b class="v-esz"></b></span>
        ${d.proxy_endpoint ? `<span>端点 <b>${esc(d.proxy_endpoint)}</b></span>` : ""}
      </div>
      <div class="acts">
        <button data-a="toggle">${d.state === "collecting" ? "⏸ 暂停" : "▶ 恢复"}</button>
        <button data-a="proxy">${d.proxy ? "停代理" : "开代理"}</button>
        <button data-a="rel" title="临时让出串口 5 分钟（外部工具可用）">让口 5m</button>
        <button data-a="reo" title="串口层软重连：立即关口→重开（透传会话会断开重连）">软重连</button>
        <button data-a="rst" class="danger" title="USB 层重枚举设备节点（需管理员，非提权守护会弹 UAC）">USB 重置</button>
        <button data-a="flash">刷机…</button>
      </div>`;
    // 整卡可点切换查看（操作按钮阻止冒泡，避免按"暂停"顺带换台）
    el.onclick = () => selectDev(d.name);
    el.querySelector(".name").onclick = e => { e.stopPropagation(); selectDev(d.name); };
    el.querySelector('[data-a="view"]').onclick = e => { e.stopPropagation(); selectDev(d.name); };
    el.querySelector('[data-a="toggle"]').onclick = e => { e.stopPropagation(); cmd(
      d.state === "collecting" ? "pause" : "resume", "^" + d.name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "$"); };
    el.querySelector('[data-a="proxy"]').onclick = e => { e.stopPropagation();
      d.proxy ? cmd("proxy", "^"+d.name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"$", "stop")
              : cmd("proxy", d.key); };
    const anchor = "^" + d.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "$";
    el.querySelector('[data-a="rel"]').onclick = e => { e.stopPropagation();
      cmd("release", anchor, "", {for_ms: 300000}); };
    el.querySelector('[data-a="reo"]').onclick = e => { e.stopPropagation(); cmd("reopen", anchor); };
    el.querySelector('[data-a="rst"]').onclick = e => { e.stopPropagation();
      if (confirm("USB 重置 " + d.name + "？\n重枚举设备节点（守护进程未提权时会弹 UAC），采集会短暂中断。"))
        cmd("reset", anchor); };
    el.querySelector('[data-a="flash"]').onclick = e => { e.stopPropagation(); openFlash(d.name); };
    c.appendChild(el);
  }
  updateVolatile();
  syncDevSel();
}

// updateVolatile: 每秒仅刷新数字（写入速率/日志体积），DOM 节点不动。
function updateVolatile(){
  for (const d of status.devices){
    const card = document.querySelector(`.card[data-dev="${CSS.escape(d.name)}"]`);
    if (!card) continue;
    card.querySelector(".v-rate").textContent = (rate[d.name]||0) + " B/s";
    card.querySelector(".v-ssz").textContent = fmtKB(d.serial_size);
    card.querySelector(".v-esz").textContent = fmtKB(d.events_size);
  }
}

// syncDevSel: 日志区设备下拉与卡片选择双向同步。
function syncDevSel(){
  const sel = $("devSel");
  sel.innerHTML = status.devices
    .map(d=>`<option value="${esc(d.name)}">${esc(d.name)} · ${esc(d.tty)}</option>`).join("");
  if (selDev && status.devices.some(d=>d.name === selDev)) sel.value = selDev;
}

let toastTimer = null;
function toast(msg, ok){
  const el = $("toast");
  el.textContent = msg;
  el.style.color = ok ? "var(--teal)" : "var(--red)";
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 4000);
}

const CMD_LABEL = {pause:"暂停", resume:"恢复", proxy:"代理", release:"让口", reopen:"软重连", reset:"USB 重置"};
function cmd(c, pattern, action, extra){
  fetch("/api/cmd", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(Object.assign({cmd:c, pattern:pattern||"", action:action||""}, extra||{}))}
  ).then(r=>r.json()).then(j=>{
    if (!j.ok) { toast("✗ " + (CMD_LABEL[c]||c) + "失败: " + (j.error||"未知"), false); return; }
    let label = CMD_LABEL[c] || c;
    if (c==="proxy") label = action==="stop" ? "代理已停止" : "代理已启动" + (j.endpoint?" "+j.endpoint:"");
    if (c==="reset") label = "USB 重置完成，采集已恢复";
    if (c==="release") label = "已让口 5 分钟（到期自动回采）";
    toast("✓ " + label, true);
    setTimeout(pollStatus, 300);
  }).catch(e=>toast("✗ 请求失败: "+e, false));
}

// —— 刷机模态：上传镜像/args → POST /api/flash → SSE 进度流 ——
let fmES = null;
function anchorRe(name){ return "^" + name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "$"; }
function openFlash(name){
  $("fmDev").textContent = name ? "· " + name : "";
  $("fmPattern").value = name ? anchorRe(name) : "";
  $("fmLog").textContent = ""; $("fmState").textContent = ""; $("fmGo").disabled = false;
  $("flashModal").classList.remove("hidden");
}
function fmState(t, bad){ $("fmState").textContent = t; $("fmState").style.color = bad ? "var(--red)" : "var(--dim)"; }
function fmAppend(line){
  const el = $("fmLog");
  el.textContent += line + "\n";
  if (el.scrollHeight - el.scrollTop - el.clientHeight < 60) el.scrollTop = el.scrollHeight;
}
$("fmClose").onclick = () => { $("flashModal").classList.add("hidden"); if (fmES){ fmES.close(); fmES = null; } };
$("fmGo").onclick = () => {
  const fd = new FormData();
  const pattern = $("fmPattern").value.trim();
  if (!pattern) { fmState("设备正则必填", true); return; }
  fd.append("pattern", pattern);
  const args = $("fmArgs").files[0];
  if (args) fd.append("args_file", args, args.name || "flasher_args.json");
  else {
    const bins = Array.from($("fmBins").files || []);
    if (!bins.length) { fmState("先选镜像文件或 flasher_args.json", true); return; }
    for (const f of bins) fd.append("bins", f, f.name);
    const off = $("fmOffsets").value.trim();
    if (off) fd.append("offsets", off);
  }
  $("fmGo").disabled = true; fmState("上传中…");
  fetch("/api/flash", {method:"POST", body:fd}).then(r=>{
    if (!r.ok) return r.text().then(t=>Promise.reject(t));
  }).then(()=>{
    fmState("刷写中（让口 → esptool → 回采）…");
    if (fmES) fmES.close();
    fmES = new EventSource("/api/flash/stream");
    fmES.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.line) fmAppend(m.line);
      if (m.done){
        fmES.close(); fmES = null; $("fmGo").disabled = false;
        fmState(m.err ? "✗ " + m.err : "✓ 刷写完成，已恢复采集", !!m.err);
        setTimeout(pollStatus, 500);
      }
    };
  }).catch(e=>{ fmState("✗ " + e, true); $("fmGo").disabled = false; });
};

function selectDev(name){
  selDev = name;
  for (const t of document.querySelectorAll(".tab"))
    t.classList.toggle("on", t.dataset.kind === selKind);
  // 选中态就地切换（不重建卡片），下拉同步
  document.querySelectorAll(".card").forEach(c=>c.classList.toggle("sel", c.dataset.dev === selDev));
  const ds = $("devSel");
  if (status.devices.some(d=>d.name === selDev) && ds.value !== selDev) ds.value = selDev;
  openStream();
  renderCards();
}
$("devSel").onchange = () => { const v = $("devSel").value; if (v) selectDev(v); };
for (const t of document.querySelectorAll(".tab"))
  t.onclick = () => { selKind = t.dataset.kind;
    for (const x of document.querySelectorAll(".tab")) x.classList.toggle("on", x===t);
    if (selDev) openStream(); };

function openStream(){
  if (es) { es.close(); es = null; }
  logBuf = ""; $("log").textContent = "";
  $("viewerDev").textContent = selDev ? selDev + " · " + (selKind==="serial"?"全量":"事件流") : "";
  if (!selDev) { $("log").textContent = "选择左侧设备卡片查看…"; return; }
  es = new EventSource(`/api/devices/${encodeURIComponent(selDev)}/live?kind=${selKind}`);
  es.onmessage = ev => {
    let chunk; try { chunk = JSON.parse(ev.data); } catch { return; }
    logBuf += chunk;
    if (logBuf.length > LOG_CAP) logBuf = logBuf.slice(-LOG_CAP);
    renderLog();
  };
  es.onerror = () => { /* EventSource 自动重连；面板保持最后内容 */ };
}

function renderLog(){
  const el = $("log");
  const stick = $("autoscroll").checked &&
    el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  if (selKind === "events") {
    // 事件流：命中签名/错误级行高亮（esc 防 HTML 注入）
    el.innerHTML = logBuf.split("\n").map(l => {
      const safe = esc(l);
      return HIT.test(l) ? `<span class="hit">${safe}</span>` : safe;
    }).join("\n");
  } else {
    el.textContent = logBuf;
  }
  if (stick) el.scrollTop = el.scrollHeight;
}
$("btnClear").onclick = () => { logBuf = ""; $("log").textContent = ""; };

const HIT = /rst:0x|Guru|Backtrace|panic|abort|assert|watchdog|WDT/i;
function pollEvents(){
  fetch("/api/events").then(r=>r.json()).then(list=>{
    const el = $("events");
    if (!list || !list.length){ el.innerHTML = '<div class="dim" style="padding:12px">暂无事件</div>'; return; }
    el.innerHTML = list.map(g =>
      `<div class="ev-dev">▸ ${esc(g.device)}</div>` +
      g.lines.map(l =>
        `<div class="ev-line${HIT.test(l)?" hit":""}">${esc(l)}</div>`).join("")
    ).join("");
  }).catch(()=>{});
}
setInterval(pollEvents, 5000); pollEvents();
</script>
</body>
</html>
